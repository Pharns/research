site_name: Pharns Genece — Notes from the Field
site_url: https://research.pharns.com/
site_author: Pharns Genece
site_description: What I have learned and am still learning in cybersecurity — research, notes, and lessons shared to help others in the field.
copyright: © 2026 Pharns Genece

theme:
  name: material
  custom_dir: overrides
  font:
    text: Source Serif 4
    code: JetBrains Mono
  palette:
    # Light is the default for every visitor (no OS-preference media query);
    # the toggle switches to dark and the choice is remembered.
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Light mode
  features:
    - navigation.top
    - content.code.copy

plugins:
  - search
  - blog:
      blog_dir: notebook
      blog_toc: true
      post_date_format: long
      archive: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

extra_css:
  - assets/site.css

nav:
  - Home: index.md
  # Notebook hidden until 2+ posts clear the disclosure check (Pharns, 2026-10-14).
  # To unhide, add:
  # - Notebook:
  #     - notebook/index.md

extra:
  social:
    - icon: simple/substack
      link: https://pharns.substack.com/
      name: Substack
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0009-0791-4124
    - icon: fontawesome/brands/github
      link: https://github.com/Pharns
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/pharns
